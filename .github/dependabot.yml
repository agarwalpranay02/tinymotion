version: 2
# Grouped minor and patch updates, once a month. Major upgrades are done by hand,
# because they usually need code changes (Next.js, ESLint, TensorFlow).
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      web: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # @opentelemetry/resources accepts api <1.10 only; bump together once it does
      - dependency-name: "@opentelemetry/api"
  - package-ecosystem: pip
    directory: /ml
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      ml: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
