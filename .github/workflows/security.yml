name: Security
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "23 3 * * 1" }]
  workflow_dispatch:
permissions: { contents: read, security-events: write }

jobs:
  codeql:
    runs-on: ubuntu-latest
    strategy: { matrix: { language: [javascript-typescript, python] } }
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with: { languages: "${{ matrix.language }}", queries: security-extended }
      - uses: github/codeql-action/analyze@v4
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: cd apps/web && npm ci --ignore-scripts && npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install pip-audit && pip-audit -r ml/requirements.txt
